org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compile Kotlin in the Gradle JVM to avoid forking a second daemon (keeps
# total memory down on small build machines).
kotlin.compiler.execution.strategy=in-process

# The daemon must not outlive the build. This host has 2 GB of RAM, and a
# daemon left resident keeps its whole heap: two of them is more memory than
# the machine has, which is how it OOM-killed java repeatedly and hung on
# 2026-10-04. Builds start a little slower; the host survives them.
org.gradle.daemon=false
