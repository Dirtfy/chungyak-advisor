# PR·main 푸시: 디버그 빌드 + 단위 테스트만. 서명하지 않고 Secrets도 쓰지 않는다.
# (서버에서는 빌드 금지 — 빌드는 GitHub 호스팅 러너에서만.)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests + debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      # Room이 KSP로 내보낸 스키마 JSON(app/schemas) — 서버에서 빌드하지 않으므로 여기서 받아 커밋한다.
      - name: Room schema JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-schemas
          path: android/app/schemas
      - name: Test reports on failure
        if: failure()
        run: find app/build/test-results -name '*.xml' -exec grep -l '<failure' {} + | xargs -r -n1 sed -n '/<failure/,/<\/failure>/p' | head -200
