# v* 태그 푸시: 기존 고정 키(오너 폰 설치본과 같은 키)로 서명한 release APK를 빌드해 같은 이름의 GitHub Release에 붙인다.
# Secrets는 이 job에서만 쓴다. 키스토어는 러너 임시 경로에 복원하고 job 끝에 지운다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 인앱 업데이트는 태그(vX.Y.Z)를 버전으로 읽는다 → 앱 versionName과 다르면 업데이트 판정이 어긋난다.
      - name: Tag matches appVersion
        run: |
          v=$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          echo "appVersion=$v tag=$TAG"
          test "v$v" = "$TAG"

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'SHA-256 digest' "$RUNNER_TEMP/certs.txt"
          cp "$apk" "$RUNNER_TEMP/chungyak-radar-$TAG.apk"

      # 초안으로 만들고 APK를 붙인 뒤 공개 → 앱이 APK 없는 Release를 '최신'으로 보는 순간이 없다.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="$RUNNER_TEMP/chungyak-radar-$TAG.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "청약 레이더 $TAG — GitHub Actions에서 빌드·서명."
          fi
          gh release upload "$TAG" "$apk" --clobber
          gh release edit "$TAG" --draft=false --latest
